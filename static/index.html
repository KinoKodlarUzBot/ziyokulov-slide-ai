<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerPoint AI Slide Generator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
        }
        h2 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 5px;
            color: var(--tg-theme-button-color, #2481cc);
        }
        .subtitle {
            font-size: 13px;
            color: #777;
            text-align: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .template-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 8px;
            background: #fff;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        .template-card.active {
            border-color: var(--tg-theme-button-color, #2481cc);
            box-shadow: 0 0 10px rgba(36, 129, 204, 0.3);
            background-color: #f0f8ff;
        }
        .template-card img {
            width: 100%;
            height: 85px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .template-card span {
            font-size: 12px;
            font-weight: 600;
            display: block;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.6;
        }
        #status {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 PowerPoint Slide Maker</h2>
    <div class="subtitle">Ramka stili va mavzuni tanlang, AI slayd tayyorlaydi</div>

    <!-- RAMKALAR RO'YXATI -->
    <div class="section-title">1. Slayd ramkasi (Dizaynini) tanlang:</div>
    <div class="templates-grid">
        <div class="template-card active" onclick="selectTemplate('classic', this)">
            <img src="https://via.placeholder.com/150/ffffff/000000?text=Classic+Oq" alt="Classic">
            <span>⚪ Klassik Oq</span>
        </div>
        <div class="template-card" onclick="selectTemplate('business', this)">
            <img src="https://via.placeholder.com/150/1e3a8a/ffffff?text=Business+Blue" alt="Business">
            <span>🔵 Ko'k Biznes</span>
        </div>
        <div class="template-card" onclick="selectTemplate('dark', this)">
            <img src="https://via.placeholder.com/150/18181b/ffffff?text=Dark+Mode" alt="Dark">
            <span>🖤 Modern Dark</span>
        </div>
        <div class="template-card" onclick="selectTemplate('minimal', this)">
            <img src="https://via.placeholder.com/150/f0fdf4/166534?text=Green+Minimal" alt="Minimal">
            <span>🟢 Och Yashil</span>
        </div>
    </div>

    <!-- MAVZU KIRITISH -->
    <div class="section-title">2. Slayd mavzusini kiriting:</div>
    <input type="text" id="topicInput" placeholder="Masalan: Koinot va Galaktikalar">

    <button id="generateBtn" onclick="generateSlide()">✨ Slaydni Yaratish</button>
    <div id="status"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let selectedTemplate = 'classic';

    function selectTemplate(templateName, element) {
        selectedTemplate = templateName;
        document.querySelectorAll('.template-card').forEach(card => card.classList.remove('active'));
        element.classList.add('active');
        if (tg.HapticFeedback) {
            tg.HapticFeedback.selectionChanged();
        }
    }

    async function generateSlide() {
        const topic = document.getElementById('topicInput').value.trim();
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('generateBtn');

        if (!topic) {
            statusDiv.style.color = "red";
            statusDiv.innerText = "Iltimos, mavzu nomini kiritiring!";
            return;
        }

        const userId = tg.initDataUnsafe?.user?.id;
        if (!userId) {
            statusDiv.style.color = "red";
            statusDiv.innerText = "Telegram user_id topilmadi! Botingizni qayta ishga tushiring.";
            return;
        }

        btn.disabled = true;
        statusDiv.style.color = "#2481cc";
        statusDiv.innerText = "⏳ AI tanlangan ramka bo'yicha slayd tayyorlamoqda...";

        try {
            const response = await fetch('/api/generate-slide', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    user_id: userId, 
                    topic: topic,
                    template: selectedTemplate
                })
            });

            const result = await response.json();

            if (response.ok) {
                statusDiv.style.color = "green";
                statusDiv.innerText = "✅ Slaydingiz tayyor! Botingizga yuborildi.";
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } else {
                throw new Error(result.detail || "Xatolik yuz berdi");
            }
        } catch (error) {
            statusDiv.style.color = "red";
            statusDiv.innerText = "❌ Xatolik: " + error.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
